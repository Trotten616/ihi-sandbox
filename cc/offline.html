<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7c2d12" />
  <title>[SANDBOX] Offline · Command Center</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: #f4f6f9; color: #1a2332; box-sizing: border-box; }
    @media (prefers-color-scheme: dark) { body { background: #0f141c; color: #e8edf5; } .card { background: #1a2230 !important; border-color: #2f3b4f !important; } p { color: #a0aabe !important; } }
    .card { max-width: 360px; width: 100%; background: #fff; border: 1px solid #d8dee8; border-radius: 12px; padding: 24px 20px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 1.2rem; margin: 16px 0 8px; }
    p { color: #5a6577; margin: 0 0 20px; line-height: 1.45; }
    button { min-height: 48px; width: 100%; border: 0; border-radius: 8px; background: #1f6feb; color: #fff; font: inherit; font-weight: 600; font-size: 1rem; }
  </style>
</head>
<body>
  <main class="card" role="alert">
    <img src="assets/icons/icon-192.png" alt="" />
    <h1>You’re offline.</h1>
    <p>Reconnect to see current numbers.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
